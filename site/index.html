<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>期貨商活動看板</title>
    <meta name="description" content="彙整 13 家期貨商官網正在舉辦的交易活動與開戶優惠。" />
    <link rel="stylesheet" href="style.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🎁</text></svg>"
    />
    <script>
      // Applied before first paint so the page never flashes the wrong theme.
      (() => {
        const saved = localStorage.getItem('theme');
        const dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.dataset.size = localStorage.getItem('size') ?? '2';
      })();
    </script>
  </head>
  <body>
    <header class="top">
      <div class="bar">
        <a class="brand" href="./">
          <span class="brand-mark">期</span>
          <span>期貨商活動看板</span>
        </a>
        <div class="tools">
          <div class="sizer" role="group" aria-label="字體大小">
            <button type="button" data-size-step="-1" aria-label="縮小字體">A−</button>
            <span class="sizer-now" id="size-now">中</span>
            <button type="button" data-size-step="1" aria-label="放大字體">A+</button>
          </div>
          <button type="button" class="theme" id="theme" aria-label="切換日夜模式"></button>
        </div>
      </div>

      <div class="hero">
        <h1>正在舉辦的期貨商活動</h1>
        <p class="lede">
          13 家期貨商官網的交易活動與開戶優惠，每個上班日自動更新。
          <strong>活動辦法與獎勵請以各期貨商官網公告為準。</strong>
        </p>
        <div class="counts" id="counts"></div>
      </div>
    </header>

    <nav class="tabs" id="tabs" aria-label="檢視方式">
      <button class="tab is-on" data-view="timeline">時間軸</button>
      <button class="tab" data-view="cards">卡片</button>
    </nav>

    <section class="filters" id="filters">
      <div class="filter-group" data-filter="status">
        <span class="filter-label">狀態</span>
        <button class="chip is-on" data-value="live">進行中</button>
        <button class="chip" data-value="all">全部</button>
        <button class="chip" data-value="ended">已結束</button>
      </div>
      <div class="filter-group" data-filter="audience">
        <span class="filter-label">對象</span>
        <button class="chip is-on" data-value="all">不限</button>
        <button class="chip" data-value="新戶">新戶可參加</button>
      </div>
      <div class="filter-group" data-filter="sort">
        <span class="filter-label">排序</span>
        <button class="chip is-on" data-value="end">依結束日</button>
        <button class="chip" data-value="value">依最高獎勵</button>
        <button class="chip" data-value="broker">依期貨商</button>
      </div>
    </section>

    <main id="main"></main>

    <footer class="foot">
      <p id="updated"></p>
      <p>
        資料取自各期貨商官網公開頁面，由程式自動判讀，可能有誤判或遺漏；
        僅發布於社群平台的活動不在收錄範圍。實際活動辦法、期間與獎勵，
        以各期貨商官方公告為準。
      </p>
    </footer>

    <script src="app.js" type="module"></script>
  </body>
</html>
